[package]
name = "bytefield-world"
description = "A level's static world (terrain, placed objects), loaded headless"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
bytefield-vfs = { path = "../vfs" }
bytefield-con = { path = "../con-lang" }
bytefield-formats = { path = "../formats" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
bytefield-testdata = { path = "../testdata" }
