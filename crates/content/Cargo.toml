[package]
name = "bytefield-content"
description = "What the player has and turns on: the install, the mods, the graphics packs and the graphics profile"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
bytefield-con = { path = "../con-lang" }
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[[bin]]
name = "bytefield-content"
path = "src/main.rs"
