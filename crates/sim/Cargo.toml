[package]
name = "bytefield-sim"
description = "The simulation core: vehicle models from templates, deterministic fixed-step world"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
pprof = { version = "0.15", optional = true, default-features = false }
bytefield-vfs = { path = "../vfs" }
bytefield-con = { path = "../con-lang" }
bytefield-formats = { path = "../formats" }
bytefield-world = { path = "../world" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
bincode = "1.3.3"
# the walkable-surface navigation mesh (`navmesh`); pinned, MIT OR Apache-2.0; `libm` keeps its floating point the same on
# every platform
rerecast = { version = "=1.0.0", default-features = false, features = ["std", "libm"] }
glam = "0.33"
libm = "0.2"

[features]
default = []
# a sampling profiler for examples/bots (`BOTS_PROF=<out.txt>`), without perf and without root
prof = ["dep:pprof"]

[dev-dependencies]
bytefield-testdata = { path = "../testdata" }
# the other Recast port, only to compare with rerecast in examples/navmesh_n0; pinned, MIT OR Apache-2.0
landmark = { version = "=0.2.0", default-features = false }
glam030 = { package = "glam", version = "0.30" }
