# What licences the dependencies may have, for a GPL-3 program: `cargo deny check licenses` (the CI runs it).
[graph]
all-features = false

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "GPL-3.0-or-later", "MIT-0", "0BSD", "Unlicense"]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
